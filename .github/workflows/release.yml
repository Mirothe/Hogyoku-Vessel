# builds the app on Windows, Linux and both kinds of Mac, then puts every build on the GitHub release.
# push a tag like v1.1.0 to start it, or run it by hand from the Actions tab to just get the files
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash build.sh
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: bash installer/build.sh "${{ github.repository }}"
      - name: Keep the jar from one build only
        if: runner.os != 'Linux'
        run: rm -f "out/dist/Hogyoku Vessel.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: out/dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
